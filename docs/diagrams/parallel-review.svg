<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="parallel-review-title parallel-review-desc" id="parallel-review-root">
        <title id="parallel-review-title">Review: independent checks, one verdict.</title>
        <desc id="parallel-review-desc">The main agent routes and checks the project, runs read-only specialist reviews alongside test work, then combines results before reporting.</desc>
        <defs>
      <style>#parallel-review-root { --color-paper:   #fafbfc;
      --color-ink:     #0c1118;
      --color-muted:   #63717b;
      --color-accent:  #287d78;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #parallel-review-root { font-family: var(--font-sans); color: var(--color-ink); }
      #parallel-review-root .diagram-container { width: 100%; overflow-x: auto; }
      #parallel-review-root .diagram-container { overflow-x: visible; }</style>
          <marker id="parallel-review-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#63717b"/></marker>
          <marker id="parallel-review-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>
          <marker id="parallel-review-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>



        </defs>

        <rect width="100%" height="100%" fill="#fafbfc"/>


        <text x="40" y="64" font-family="Instrument Serif, serif" font-size="28" fill="#0c1118">Review: independent checks, one verdict.</text>
<path d="M 480 176 V 224" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#parallel-review-arrow)"/>
<path d="M 360 256 H 280" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#parallel-review-arrow)"/>
<rect x="300" y="226" width="40" height="16" fill="#fafbfc"/><text x="320" y="237" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">NO</text>
<path d="M 480 288 V 304" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#parallel-review-arrow)"/>
<rect x="504" y="286" width="40" height="16" fill="#fafbfc"/><text x="524" y="297" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">YES</text>
<path d="M 488 308 H 792 Q 800 308 800 316 V 336" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#parallel-review-arrow)"/>

<path d="M 192 400 V 416 Q 192 424 200 424 H 440 Q 448 424 448 432 V 448" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#parallel-review-arrow)"/>
<path d="M 768 400 V 416 Q 768 424 760 424 H 520 Q 512 424 512 432 V 448" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#parallel-review-arrow)"/>
<path d="M 472 308 H 168 Q 160 308 160 316 V 336" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#parallel-review-arrow)"/><circle cx="480" cy="308" r="4" fill="#0c1118"/>
<rect x="360" y="112" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="480" y="136" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Context and platform</text>
<text x="480" y="152" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">resolve intent + approved cases</text>
<path d="M 480 224 L 600 256 L 480 288 L 360 256 Z" fill="#ffffff" stroke="#0c1118"/>
<text x="480" y="248" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Fast checks pass?</text>
<text x="480" y="264" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">type / build + lint</text>
<rect x="40" y="224" width="240" height="64" rx="20" fill="#ffffff" stroke="#0c1118"/>
<text x="160" y="248" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Blocked</text>
<text x="160" y="264" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">fix failed checks before review</text>
<rect x="40" y="336" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="160" y="360" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Selected specialists</text>
<text x="160" y="376" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">read-only · collect every result</text>
<rect x="680" y="336" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="800" y="360" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Main agent test work</text>
<text x="800" y="376" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">tests (without coverage)</text>
<rect x="360" y="448" width="240" height="64" rx="6" fill="#287d78" stroke="#287d78" fill-opacity="0.08"/>
<text x="480" y="472" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Combine findings</text>
<text x="480" y="488" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">dedupe · evidence · coverage gaps</text>
<line x1="40" y1="540" x2="920" y2="540" stroke="#e0e5e8"/>
<text x="40" y="564" font-family="Geist Mono, monospace" font-size="9" fill="#63717b">READY TO MERGE: clean + checks pass · BLOCKED: error / gate fails · INCOMPLETE: review gap</text>

      </svg>
