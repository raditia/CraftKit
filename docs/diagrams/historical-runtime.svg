<svg viewBox="0 0 1008 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="historical-runtime-title historical-runtime-desc" id="historical-runtime-root">
        <title id="historical-runtime-title">Runtime map: the original proposal.</title>
        <desc id="historical-runtime-desc">The historical MCP-context plan connects a Claude-only Gateway to orchestrators, skills, agents, host MCP servers and repository feature state.</desc>
        <defs>
      <style>#historical-runtime-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #historical-runtime-root { font-family: var(--font-sans); color: var(--color-ink); }
      #historical-runtime-root .diagram-container { width: 100%; overflow-x: auto; }
      #historical-runtime-root .diagram-container { overflow-x: visible; }</style>
          <marker id="historical-runtime-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
