<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sync-engine-title sync-engine-desc" id="sync-engine-root">
        <title id="sync-engine-title">One source. Four tools.</title>
        <desc id="sync-engine-desc">CraftKit distributes rules, skills, commands, agents and injected partials through sync.sh to four independent tool destinations.</desc>
        <defs>
      <style>#sync-engine-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #sync-engine-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sync-engine-root .diagram-container { width: 100%; overflow-x: auto; }
      #sync-engine-root .diagram-container { overflow-x: visible; }</style>
