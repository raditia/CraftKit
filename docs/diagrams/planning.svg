<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="planning-title planning-desc" id="planning-root">
        <title id="planning-title">Approve the plan before building.</title>
        <desc id="planning-desc">Define progresses through interview, spec, approved test cases and task planning, with user checkpoints before handing off to build.</desc>
        <defs>
      <style>#planning-root { --color-paper:   #fafbfc;
      --color-ink:     #0c1118;
      --color-muted:   #63717b;
      --color-accent:  #287d78;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #planning-root { font-family: var(--font-sans); color: var(--color-ink); }
      #planning-root .diagram-container { width: 100%; overflow-x: auto; }
      #planning-root .diagram-container { overflow-x: visible; }</style>
          <marker id="planning-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#63717b"/></marker>
          <marker id="planning-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>
          <marker id="planning-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>



        </defs>

        <rect width="100%" height="100%" fill="#fafbfc"/>


        <text x="40" y="64" font-family="Instrument Serif, serif" font-size="28" fill="#0c1118">Approve the plan before building.</text>
<path d="M 280 160 H 360" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#planning-arrow)"/>
<rect x="294" y="130" width="52" height="16" fill="#fafbfc"/><text x="320" y="141" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">APPROVE</text>
<path d="M 600 160 H 680" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#planning-arrow)"/>
<rect x="614" y="130" width="52" height="16" fill="#fafbfc"/><text x="640" y="141" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">APPROVE</text>
<path d="M 800 192 V 288" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#planning-arrow)"/>
<rect x="818" y="230" width="52" height="16" fill="#fafbfc"/><text x="844" y="241" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">APPROVE</text>
<path d="M 680 320 H 600" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#planning-arrow)"/>
<rect x="618" y="290" width="44" height="16" fill="#fafbfc"/><text x="640" y="301" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">OFFER</text>
<path d="M 360 320 H 280" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#planning-arrow)"/>
<path d="M 480 448 V 424 Q 480 416 472 416 H 336 Q 328 416 328 408 V 208 Q 328 200 336 200 H 472 Q 480 200 480 192" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#planning-arrow)"/>
<rect x="264" y="374" width="48" height="16" fill="#fafbfc"/><text x="288" y="385" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">CHOICE</text>
<rect x="40" y="128" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="160" y="152" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Discover</text>
<text x="160" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">/interview · skip if ask is clear</text>
<rect x="360" y="128" width="240" height="64" rx="6" fill="#287d78" stroke="#287d78" fill-opacity="0.08"/>
<text x="480" y="152" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Write the spec</text>
<text x="480" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">/spec · verifiable criteria</text>
<rect x="680" y="128" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="800" y="152" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Approve test cases</text>
<text x="800" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">/test-cases · source / inferred IDs</text>
<rect x="680" y="288" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="800" y="312" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Plan ordered tasks</text>
<text x="800" y="328" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">/plan · checks + dependencies</text>
<rect x="360" y="288" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="480" y="312" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Stress-test the plan</text>
<text x="480" y="328" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">optional plan-roaster</text>
<rect x="40" y="288" width="240" height="64" rx="20" fill="#ffffff" stroke="#0c1118"/>
<text x="160" y="312" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Hand off to build</text>
<text x="160" y="328" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">/parallel-build · separate request</text>
<rect x="360" y="448" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="480" y="472" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Optional ideation</text>
<text x="480" y="488" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">/ideate when approach is open</text>
<line x1="40" y1="540" x2="920" y2="540" stroke="#e0e5e8"/>
<text x="40" y="564" font-family="Geist Mono, monospace" font-size="9" fill="#63717b">At each checkpoint: continue / edit / stop. /define stops at the plan; it does not build.</text>

      </svg>
