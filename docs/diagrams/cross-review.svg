<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1008 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cross-review-title cross-review-desc" id="cross-review-root">
        <title id="cross-review-title">Two providers. One evidence-based review.</title>
        <desc id="cross-review-desc">Cross-review requires approved Claude and Codex access, runs one independent round and one peer critique, validates responses and lets the host adjudicate.</desc>
        <defs>
      <style>#cross-review-root { --color-paper:   #fafbfc;
      --color-ink:     #0c1118;
      --color-muted:   #63717b;
      --color-accent:  #287d78;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #cross-review-root { font-family: var(--font-sans); color: var(--color-ink); }
      #cross-review-root .diagram-container { width: 100%; overflow-x: auto; }
      #cross-review-root .diagram-container { overflow-x: visible; }</style>
          <marker id="cross-review-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#63717b"/></marker>
          <marker id="cross-review-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>
          <marker id="cross-review-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>



        </defs>

        <rect width="100%" height="100%" fill="#fafbfc"/>


        <g transform="translate(24,0)"><text x="40" y="64" font-family="Instrument Serif, serif" font-size="28" fill="#0c1118">Two providers. One evidence-based review.</text>
<path d="M 480 176 V 224" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#cross-review-arrow)"/>
<path d="M 360 256 H 280" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#cross-review-arrow)"/>
<rect x="300" y="226" width="40" height="16" fill="#fafbfc"/><text x="320" y="237" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">NO</text>
<path d="M 480 288 V 336" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#cross-review-arrow)"/>
<rect x="504" y="302" width="40" height="16" fill="#fafbfc"/><text x="524" y="313" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">YES</text>
<path d="M 480 400 V 448" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#cross-review-arrow)"/>
<path d="M 480 512 V 524 Q 480 532 472 532 H 24 Q 16 532 16 524 V 264 Q 16 256 24 256 H 40" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#cross-review-arrow)"/>
<rect x="68" y="506" width="40" height="16" fill="#fafbfc"/><text x="88" y="517" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">NO</text>
<path d="M 600 480 H 680" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#cross-review-arrow)"/>
<rect x="620" y="450" width="40" height="16" fill="#fafbfc"/><text x="640" y="461" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">YES</text>
<rect x="360" y="112" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="480" y="136" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Approved panel preflight</text>
<text x="480" y="152" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">both CLIs · exact project allowlist</text>
<path d="M 480 224 L 600 256 L 480 288 L 360 256 Z" fill="#ffffff" stroke="#0c1118"/>
<text x="480" y="248" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Preflight passes?</text>
<text x="480" y="264" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">fail closed before sending diff</text>
<rect x="40" y="224" width="240" height="64" rx="20" fill="#ffffff" stroke="#0c1118"/>
<text x="160" y="248" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Could not run</text>
<text x="160" y="264" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">stop; report provider-panel failure</text>
<rect x="360" y="336" width="240" height="64" rx="6" fill="#287d78" stroke="#287d78" fill-opacity="0.08"/>
<text x="480" y="360" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Claude + Codex</text>
<text x="480" y="376" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">round 1 blind · round 2 peer critique</text>
<path d="M 480 448 L 600 480 L 480 512 L 360 480 Z" fill="#ffffff" stroke="#0c1118"/>
<text x="480" y="472" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Replies / tree valid?</text>
<text x="480" y="488" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">each finding answered · unchanged</text>
<rect x="680" y="448" width="240" height="64" rx="20" fill="#ffffff" stroke="#0c1118"/>
<text x="800" y="472" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Host adjudicates</text>
<text x="800" y="488" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">cited evidence + provenance</text>
<line x1="40" y1="540" x2="920" y2="540" stroke="#e0e5e8"/>
<text x="40" y="564" font-family="Geist Mono, monospace" font-size="9" fill="#63717b">AGREE · DISPUTE · CANNOT-VERIFY · tracked diff only; untracked and binaries have coverage limits.</text></g>

      </svg>
