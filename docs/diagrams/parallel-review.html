<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Review: independent checks, one verdict.</h1>


    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="parallel-review-title parallel-review-desc">
        <title id="parallel-review-title">Review: independent checks, one verdict.</title>
        <desc id="parallel-review-desc">The main agent routes and checks the project, runs read-only specialist reviews alongside test work, then combines results before reporting.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>



        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>


        <text x="40" y="64" font-family="Instrument Serif, serif" font-size="28" fill="#2d3142">Review: independent checks, one verdict.</text>
<path d="M 480 176 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 360 256 H 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="300" y="226" width="40" height="16" fill="#f5f5f5"/><text x="320" y="237" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">NO</text>
<path d="M 480 288 V 304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="504" y="286" width="40" height="16" fill="#f5f5f5"/><text x="524" y="297" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">YES</text>
<path d="M 488 308 H 792 Q 800 308 800 316 V 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<path d="M 192 400 V 416 Q 192 424 200 424 H 440 Q 448 424 448 432 V 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 768 400 V 416 Q 768 424 760 424 H 520 Q 512 424 512 432 V 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 472 308 H 168 Q 160 308 160 316 V 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><circle cx="480" cy="308" r="4" fill="#2d3142"/>
<rect x="360" y="112" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="480" y="136" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Context and platform</text>
<text x="480" y="152" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">resolve intent + approved cases</text>
<path d="M 480 224 L 600 256 L 480 288 L 360 256 Z" fill="#ffffff" stroke="#2d3142"/>
<text x="480" y="248" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Fast checks pass?</text>
<text x="480" y="264" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">type / build + lint</text>
<rect x="40" y="224" width="240" height="64" rx="20" fill="#ffffff" stroke="#2d3142"/>
<text x="160" y="248" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Blocked</text>
<text x="160" y="264" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">fix failed checks before review</text>
<rect x="40" y="336" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="160" y="360" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Selected specialists</text>
<text x="160" y="376" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">read-only · collect every result</text>
<rect x="680" y="336" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="800" y="360" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Main agent test work</text>
<text x="800" y="376" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">tests (without coverage)</text>
<rect x="360" y="448" width="240" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
<text x="480" y="472" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Combine findings</text>
<text x="480" y="488" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">dedupe · evidence · coverage gaps</text>
<line x1="40" y1="540" x2="920" y2="540" stroke="#bfc0c0"/>
<text x="40" y="564" font-family="Geist Mono, monospace" font-size="9" fill="#4f5d75">READY TO MERGE: clean + checks pass · BLOCKED: error / gate fails · INCOMPLETE: review gap</text>

      </svg>
    </div>
  </div>
</body>
</html>
