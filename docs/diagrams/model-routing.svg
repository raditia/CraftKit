<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-routing-title model-routing-desc" id="model-routing-root">
        <title id="model-routing-title">Plan sets the window. Access sets the model.</title>
        <desc id="model-routing-desc">The Claude routing hook falls back to aliases when account data cannot be read and otherwise selects entitled models within the plan window.</desc>
        <defs>
      <style>#model-routing-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #model-routing-root { font-family: var(--font-sans); color: var(--color-ink); }
      #model-routing-root .diagram-container { width: 100%; overflow-x: auto; }
      #model-routing-root .diagram-container { overflow-x: visible; }</style>
          <marker id="model-routing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="model-routing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="model-routing-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>



        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>


