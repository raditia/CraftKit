<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Plan sets the window. Access sets the model.</h1>


    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-routing-title model-routing-desc">
        <title id="model-routing-title">Plan sets the window. Access sets the model.</title>
        <desc id="model-routing-desc">The Claude routing hook falls back to aliases when account data cannot be read and otherwise selects entitled models within the plan window.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>



        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>


        <text x="40" y="64" font-family="Instrument Serif, serif" font-size="28" fill="#2d3142">Plan sets the window. Access sets the model.</text>
<path d="M 360 144 H 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="300" y="114" width="40" height="16" fill="#f5f5f5"/><text x="320" y="125" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">NO</text>
<path d="M 480 176 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="504" y="190" width="40" height="16" fill="#f5f5f5"/><text x="524" y="201" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">YES</text>
<path d="M 600 256 H 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="606" y="226" width="68" height="16" fill="#f5f5f5"/><text x="640" y="237" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">ENTERPRISE</text>
<path d="M 480 288 V 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="496" y="302" width="56" height="16" fill="#f5f5f5"/><text x="524" y="313" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">PERSONAL</text>
<path d="M 800 288 V 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 600 368 H 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 800 400 V 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 160 176 V 516 Q 160 524 168 524 H 792 Q 800 524 800 516 V 512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="272" y="494" width="56" height="16" fill="#f5f5f5"/><text x="300" y="505" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">FALLBACK</text>
<path d="M 480 112 L 600 144 L 480 176 L 360 144 Z" fill="#ffffff" stroke="#2d3142"/>
<text x="480" y="136" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Account data readable?</text>
<text x="480" y="152" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">routing hook · every prompt</text>
<rect x="40" y="112" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="160" y="136" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Family alias fallback</text>
<text x="160" y="152" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">haiku · sonnet · opus</text>
<path d="M 480 224 L 600 256 L 480 288 L 360 256 Z" fill="#ffffff" stroke="#2d3142"/>
<text x="480" y="248" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Which plan?</text>
<text x="480" y="264" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">~/.claude.json</text>
<rect x="680" y="224" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="800" y="248" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Enterprise window</text>
<text x="800" y="264" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">sonnet · opus · fable</text>
<text x="800" y="276" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">everyday: opus</text>
<rect x="360" y="336" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="480" y="360" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Personal / unknown window</text>
<text x="480" y="376" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">haiku · sonnet · opus</text>
<text x="480" y="388" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">everyday: sonnet</text>
<rect x="680" y="336" width="240" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
<text x="800" y="360" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Newest entitled IDs</text>
<text x="800" y="376" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">within selected window</text>
<rect x="680" y="448" width="240" height="64" rx="20" fill="#ffffff" stroke="#2d3142"/>
<text x="800" y="472" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Inject model tiers</text>
<text x="800" y="488" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">cheapest · everyday · escalate</text>
<line x1="40" y1="540" x2="920" y2="540" stroke="#bfc0c0"/>
<text x="40" y="564" font-family="Geist Mono, monospace" font-size="9" fill="#4f5d75">Skills name tiers; agents use family aliases. Versioned vendor IDs fail check.sh.</text>

      </svg>
    </div>
  </div>
</body>
</html>
