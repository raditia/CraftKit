<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="synthesis-title synthesis-desc" id="synthesis-root">
        <title id="synthesis-title">Agreement raises confidence. Evidence decides.</title>
        <desc id="synthesis-desc">Independent findings are deduplicated, contradictions are settled by evidence and missing reviewers prevent a ready verdict.</desc>
        <defs>
      <style>#synthesis-root { --color-paper:   #fafbfc;
      --color-ink:     #0c1118;
      --color-muted:   #63717b;
      --color-accent:  #287d78;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #synthesis-root { font-family: var(--font-sans); color: var(--color-ink); }
      #synthesis-root .diagram-container { width: 100%; overflow-x: auto; }
      #synthesis-root .diagram-container { overflow-x: visible; }</style>
          <marker id="synthesis-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#63717b"/></marker>
          <marker id="synthesis-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>
          <marker id="synthesis-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>



        </defs>

        <rect width="100%" height="100%" fill="#fafbfc"/>


        <text x="40" y="64" font-family="Instrument Serif, serif" font-size="28" fill="#0c1118">Agreement raises confidence. Evidence decides.</text>
<path d="M 480 176 V 224" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#synthesis-arrow)"/>
<path d="M 680 256 H 600" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#synthesis-arrow)"/>
<path d="M 480 288 V 336" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#synthesis-arrow)"/>
<path d="M 360 368 H 280" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#synthesis-arrow)"/>
<rect x="300" y="338" width="40" height="16" fill="#fafbfc"/><text x="320" y="349" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">YES</text>
<path d="M 480 400 V 448" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#synthesis-arrow)"/>
<rect x="504" y="414" width="40" height="16" fill="#fafbfc"/><text x="524" y="425" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">NO</text>
<rect x="360" y="112" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="480" y="136" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Independent reviewers</text>
<text x="480" y="152" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">same files · isolated messages</text>
<rect x="360" y="224" width="240" height="64" rx="6" fill="#287d78" stroke="#287d78" fill-opacity="0.08"/>
<text x="480" y="248" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Deduplicate by file:line</text>
<text x="480" y="264" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">consensus · standard · unique</text>
<text x="480" y="276" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">contradictions: compare evidence</text>
<path d="M 480 336 L 600 368 L 480 400 L 360 368 Z" fill="#ffffff" stroke="#0c1118"/>
<text x="480" y="360" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Coverage gap?</text>
<text x="480" y="376" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">selected agent did not run</text>
<rect x="40" y="336" width="240" height="64" rx="20" fill="#ffffff" stroke="#0c1118"/>
<text x="160" y="360" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">INCOMPLETE</text>
<text x="160" y="376" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">report skipped axis + reason</text>
<rect x="360" y="448" width="240" height="64" rx="20" fill="#ffffff" stroke="#0c1118"/>
<text x="480" y="472" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Verdict from checks + evidence</text>
<text x="480" y="488" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">READY: no errors, gates pass</text>
<text x="480" y="500" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">BLOCKED: verified error / gate fails</text>
<rect x="680" y="224" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="800" y="248" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Adversarial blind spots</text>
<text x="800" y="264" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">what the panel missed</text>
<line x1="40" y1="540" x2="920" y2="540" stroke="#e0e5e8"/>
<text x="40" y="564" font-family="Geist Mono, monospace" font-size="9" fill="#63717b">CONSENSUS: 2+ independent agents · UNIQUE: uncorroborated · UNVERIFIED cannot back ERROR.</text>

      </svg>
