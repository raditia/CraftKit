      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #parallel-ship-root { font-family: var(--font-sans); color: var(--color-ink); }
      #parallel-ship-root .diagram-container { width: 100%; overflow-x: auto; }
      #parallel-ship-root .diagram-container { overflow-x: visible; }</style>
