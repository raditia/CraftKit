<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evpmr-title evpmr-desc" id="evpmr-root">
        <title id="evpmr-title">Five roles in a frontend feature.</title>
        <desc id="evpmr-desc">An Entry provides boundaries and context, a View renders Presenter output, a Presenter owns state and effects, a Model owns types and pure logic, and a Resource owns strings.</desc>
        <defs>
      <style>#evpmr-root { --color-paper:   #fafbfc;
      --color-ink:     #0c1118;
      --color-muted:   #63717b;
      --color-accent:  #287d78;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #evpmr-root { font-family: var(--font-sans); color: var(--color-ink); }
      #evpmr-root .diagram-container { width: 100%; overflow-x: auto; }
      #evpmr-root .diagram-container { overflow-x: visible; }</style>
          <marker id="evpmr-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#63717b"/></marker>
          <marker id="evpmr-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>
          <marker id="evpmr-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>



        </defs>

        <rect width="100%" height="100%" fill="#fafbfc"/>


        <text x="40" y="64" font-family="Instrument Serif, serif" font-size="28" fill="#0c1118">Five roles in a frontend feature.</text>
<path d="M 480 192 V 272" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#evpmr-arrow)"/>
<path d="M 280 304 H 360" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#evpmr-arrow)"/>
<rect x="294" y="274" width="52" height="16" fill="#fafbfc"/><text x="320" y="285" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">STRINGS</text>
<path d="M 480 336 V 416" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#evpmr-arrow)"/>
<rect x="504" y="366" width="40" height="16" fill="#fafbfc"/><text x="524" y="377" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">CALL</text>
<path d="M 600 448 H 680" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#evpmr-arrow)"/>
<rect x="360" y="128" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="480" y="152" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Entry</text>
<text x="480" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">ErrorBoundary + context providers</text>
<rect x="360" y="272" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="480" y="296" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">View</text>
<text x="480" y="312" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">pure render · usePresenter*</text>
<rect x="360" y="416" width="240" height="64" rx="6" fill="#287d78" stroke="#287d78" fill-opacity="0.08"/>
<text x="480" y="440" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Presenter</text>
<text x="480" y="456" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">hooks · state · React Query</text>
<rect x="40" y="272" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="160" y="296" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Resource</text>
<text x="160" y="312" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">display strings</text>
<rect x="680" y="416" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="800" y="440" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Model</text>
<text x="800" y="456" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">types + pure functions</text>
<line x1="40" y1="540" x2="920" y2="540" stroke="#e0e5e8"/>
<text x="40" y="564" font-family="Geist Mono, monospace" font-size="9" fill="#63717b">Frontend only. Android uses MVP; iOS uses MVVM-C. Model has no React or side effects.</text>

      </svg>
