<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-title runtime-desc" id="runtime-root">
        <title id="runtime-title">Install once. Work inside the host.</title>
        <desc id="runtime-desc">The distributor installs hooks and workflows; orchestrators coordinate workers, host MCP access and per-feature repository state.</desc>
        <defs>
      <style>#runtime-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #runtime-root { font-family: var(--font-sans); color: var(--color-ink); }
      #runtime-root .diagram-container { width: 100%; overflow-x: auto; }
      #runtime-root .diagram-container { overflow-x: visible; }</style>
          <marker id="runtime-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="runtime-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="runtime-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>



        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>


        <text x="40" y="64" font-family="Instrument Serif, serif" font-size="28" fill="#2d3142">Install once. Work inside the host.</text>
