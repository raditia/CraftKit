<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-title runtime-desc" id="runtime-root">
        <title id="runtime-title">Install once. Work inside the host.</title>
        <desc id="runtime-desc">The distributor installs hooks and workflows; orchestrators coordinate workers, host MCP access and per-feature repository state.</desc>
        <defs>
      <style>#runtime-root { --color-paper:   #fafbfc;
      --color-ink:     #0c1118;
      --color-muted:   #63717b;
      --color-accent:  #287d78;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #runtime-root { font-family: var(--font-sans); color: var(--color-ink); }
      #runtime-root .diagram-container { width: 100%; overflow-x: auto; }
      #runtime-root .diagram-container { overflow-x: visible; }</style>
          <marker id="runtime-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#63717b"/></marker>
          <marker id="runtime-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>
          <marker id="runtime-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>



        </defs>

        <rect width="100%" height="100%" fill="#fafbfc"/>


        <text x="40" y="64" font-family="Instrument Serif, serif" font-size="28" fill="#0c1118">Install once. Work inside the host.</text>
<path d="M 280 160 H 360" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#runtime-arrow)"/>
<rect x="300" y="130" width="40" height="16" fill="#fafbfc"/><text x="320" y="141" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">SYNC</text>
<path d="M 600 160 H 680" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#runtime-arrow)"/>
<rect x="618" y="130" width="44" height="16" fill="#fafbfc"/><text x="640" y="141" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">ROUTE</text>
<path d="M 768 192 V 232 Q 768 240 760 240 H 520 Q 512 240 512 248 V 288" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#runtime-arrow)"/>
<path d="M 448 352 V 392 Q 448 400 440 400 H 200 Q 192 400 192 408 V 448" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#runtime-arrow)"/>
<rect x="296" y="370" width="48" height="16" fill="#fafbfc"/><text x="320" y="381" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#63717b">SKILLS</text>
<path d="M 512 352 V 392 Q 512 400 520 400 H 760 Q 768 400 768 408 V 448" fill="none" stroke="#63717b" stroke-width="1.2" marker-end="url(#runtime-arrow)"/>
<rect x="40" y="128" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="160" y="152" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Distributor</text>
<text x="160" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">sync.sh + adapters/</text>
<rect x="360" y="128" width="240" height="64" rx="6" fill="#287d78" stroke="#287d78" fill-opacity="0.08"/>
<text x="480" y="152" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Gateway</text>
<text x="480" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">load · route · guard · exit</text>
<text x="480" y="180" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">Claude Code + Codex</text>
<rect x="680" y="128" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="800" y="152" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Orchestrators</text>
<text x="800" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">commands/*.md · resolve slug once</text>
<rect x="360" y="288" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="480" y="312" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Skills and agents</text>
<text x="480" y="328" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">skills/* · agents/*</text>
<text x="480" y="340" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">agents: Claude + Codex</text>
<rect x="40" y="448" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="160" y="472" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Host MCP client</text>
<text x="160" y="488" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">Figma · Lark</text>
<text x="160" y="500" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">Gateway does not see MCP calls</text>
<rect x="680" y="448" width="240" height="64" rx="6" fill="#ffffff" stroke="#0c1118"/>
<text x="800" y="472" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0c1118">Repository state</text>
<text x="800" y="488" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">&lt;slug&gt;.md · &lt;slug&gt;.tests.md</text>
<text x="800" y="500" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5c6973">Excel is a published view</text>
<line x1="40" y1="540" x2="920" y2="540" stroke="#e0e5e8"/>
<text x="40" y="564" font-family="Geist Mono, monospace" font-size="9" fill="#63717b">Cursor and Gemini receive advisory rules; per-feature state stays in the repository.</text>

      </svg>
