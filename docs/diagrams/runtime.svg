<text x="160" y="152" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Distributor</text>
<text x="160" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">sync.sh + adapters/</text>
<rect x="360" y="128" width="240" height="64" rx="6" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/>
<text x="480" y="152" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Gateway</text>
<text x="480" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">load · route · guard · exit</text>
<text x="480" y="180" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">Claude Code + Codex</text>
<rect x="680" y="128" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="800" y="152" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Orchestrators</text>
<text x="800" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">commands/*.md · resolve slug once</text>
<rect x="360" y="288" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
