<text x="480" y="328" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">skills/* · agents/*</text>
<text x="480" y="340" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">agents: Claude + Codex</text>
<rect x="40" y="448" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="160" y="472" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Host MCP client</text>
<text x="160" y="488" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">Figma · Lark</text>
<text x="160" y="500" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">Gateway does not see MCP calls</text>
<rect x="680" y="448" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="800" y="472" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Repository state</text>
<text x="800" y="488" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">&lt;slug&gt;.md · &lt;slug&gt;.tests.md</text>
<text x="800" y="500" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">Excel is a published view</text>
<line x1="40" y1="540" x2="920" y2="540" stroke="#bfc0c0"/>
<text x="40" y="564" font-family="Geist Mono, monospace" font-size="9" fill="#4f5d75">Cursor and Gemini receive advisory rules; per-feature state stays in the repository.</text>

      </svg>
