<path d="M 600 160 H 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/>
<rect x="618" y="130" width="44" height="16" fill="#f5f5f5"/><text x="640" y="141" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">ROUTE</text>
<path d="M 768 192 V 232 Q 768 240 760 240 H 520 Q 512 240 512 248 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/>
