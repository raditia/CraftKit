<rect x="296" y="370" width="48" height="16" fill="#f5f5f5"/><text x="320" y="381" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">SKILLS</text>
<path d="M 512 352 V 392 Q 512 400 520 400 H 760 Q 768 400 768 408 V 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/>
