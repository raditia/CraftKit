<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1008px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Derive the change. Read the intent.</h1>


    <div class="diagram-container">
      <svg viewBox="0 0 1008 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="context-flow-title context-flow-desc">
        <title id="context-flow-title">Derive the change. Read the intent.</title>
        <desc id="context-flow-desc">Derived Git context informs scaffold, review and tests; feature intent informs review, evaluation and documentation.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>



        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>


        <g transform="translate(24,0)"><text x="40" y="64" font-family="Instrument Serif, serif" font-size="28" fill="#2d3142">Derive the change. Read the intent.</text>
<path d="M 160 192 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 192 192 V 232 Q 192 240 200 240 H 440 Q 448 240 448 248 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 40 160 H 24 Q 16 160 16 168 V 472 Q 16 480 24 480 H 40" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 768 192 V 232 Q 768 240 760 240 H 520 Q 512 240 512 248 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 800 192 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="128" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="160" y="152" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Derived context</text>
<text x="160" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">/fe-context · current Git change scope</text>
<rect x="680" y="128" width="240" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
<text x="800" y="152" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Feature intent</text>
<text x="800" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">/spec · /plan · /adr</text>
<text x="800" y="180" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">docs/planning/&lt;slug&gt;.md</text>
<rect x="40" y="288" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="160" y="312" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Scaffold</text>
<text x="160" y="328" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">/fe-scaffold · EVPMR module</text>
<rect x="360" y="288" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="480" y="312" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Review</text>
<text x="480" y="328" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">/fe-review · /fe-patterns</text>
<text x="480" y="340" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">/fe-performance · /code-quality</text>
<rect x="680" y="288" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="800" y="312" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Evaluate + document</text>
<text x="800" y="328" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">/eval · /docs</text>
<rect x="40" y="448" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="160" y="472" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Test</text>
<text x="160" y="488" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">/fe-test · at least 93% coverage</text>
<line x1="40" y1="540" x2="920" y2="540" stroke="#bfc0c0"/>
<text x="40" y="564" font-family="Geist Mono, monospace" font-size="9" fill="#4f5d75">Context is derived once into the turn. Intent is per feature; no shared context cache.</text></g>

      </svg>
    </div>
  </div>
</body>
</html>
