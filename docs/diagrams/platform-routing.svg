<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="platform-routing-title platform-routing-desc" id="platform-routing-root">
        <title id="platform-routing-title">The nearest project marker wins.</title>
        <desc id="platform-routing-desc">The routing hook walks up from cwd, repeats on missing markers and injects the platform selected at the nearest matching level.</desc>
        <defs>
      <style>#platform-routing-root { --color-paper:   #fafbfc;
      --color-ink:     #0c1118;
      --color-muted:   #63717b;
      --color-accent:  #287d78;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #platform-routing-root { font-family: var(--font-sans); color: var(--color-ink); }
      #platform-routing-root .diagram-container { width: 100%; overflow-x: auto; }
      #platform-routing-root .diagram-container { overflow-x: visible; }</style>
          <marker id="platform-routing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#63717b"/></marker>
          <marker id="platform-routing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>
          <marker id="platform-routing-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287d78"/></marker>



        </defs>

        <rect width="100%" height="100%" fill="#fafbfc"/>


        <text x="40" y="64" font-family="Instrument Serif, serif" font-size="28" fill="#0c1118">The nearest project marker wins.</text>
