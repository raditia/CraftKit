<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="team-build-title team-build-desc" id="team-build-root">
        <title id="team-build-title">One file, one owner.</title>
        <desc id="team-build-desc">An explicit Claude agent-team build checks its runtime, scaffolds and assigns ownership, then stages implementation, review, tests and integration checks.</desc>
        <defs>
      <style>#team-build-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #team-build-root { font-family: var(--font-sans); color: var(--color-ink); }
      #team-build-root .diagram-container { width: 100%; overflow-x: auto; }
      #team-build-root .diagram-container { overflow-x: visible; }</style>
          <marker id="team-build-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="team-build-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="team-build-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>



        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>


        <text x="40" y="64" font-family="Instrument Serif, serif" font-size="28" fill="#2d3142">One file, one owner.</text>
<path d="M 480 176 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#team-build-arrow)"/>
<path d="M 448 288 V 304 Q 448 312 440 312 H 200 Q 192 312 192 320 V 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#team-build-arrow)"/>
<path d="M 280 368 H 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#team-build-arrow)"/>
<path d="M 768 400 V 416 Q 768 424 760 424 H 520 Q 512 424 512 432 V 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#team-build-arrow)"/>
<rect x="360" y="112" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="480" y="136" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Claude team preflight</text>
<text x="480" y="152" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">explicit /team-build · teams enabled</text>
<rect x="360" y="224" width="240" height="64" rx="6" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/>
<text x="480" y="248" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Scaffold + task board</text>
<text x="480" y="264" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">one file, one owner · dependencies</text>
<rect x="40" y="336" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="160" y="360" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Implementer teammates</text>
<text x="160" y="376" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">impl-a + impl-b · direct messages</text>
<rect x="680" y="336" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="800" y="360" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Reviewer, then tester</text>
<text x="800" y="376" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">staged after dependencies complete</text>
<rect x="360" y="448" width="240" height="64" rx="20" fill="#ffffff" stroke="#2d3142"/>
<text x="480" y="472" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Lead verifies integration</text>
<text x="480" y="488" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">type / build · lint · tests</text>
<text x="480" y="500" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">report verdict + gaps</text>
<line x1="40" y1="540" x2="920" y2="540" stroke="#bfc0c0"/>
<text x="40" y="564" font-family="Geist Mono, monospace" font-size="9" fill="#4f5d75">Claude Code runtime only. Other hosts fall back; teammates do not survive resume.</text>

