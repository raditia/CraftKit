name: Create Release on Version Bump

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from README
        id: version
        run: |
          VERSION=$(grep -m1 '^# craftkit' README.md | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$VERSION" ]; then
            echo "No version found in README header; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if tag already exists
        id: tag_check
        if: steps.version.outputs.skip == 'false'
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog entry for this version
        id: notes
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # CHANGELOG.md holds one section per release: "## v1.3.0 — 2026-01-01".
          # Print between this version's heading and the next one. The trailing space in
          # the match is load-bearing: without it v1.2.1 also matches v1.2.10.
          ENTRY=$(awk -v v="$VERSION" '
            $0 ~ "^## " v " " { flag = 1; next }
            /^## v[0-9]/      { if (flag) exit }
            flag              { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          if [ -z "$ENTRY" ]; then
            echo "::error::No CHANGELOG.md section for ${VERSION}; add one before releasing."
            exit 1
          fi
          # Use delimiter-safe output for multiline safety
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ENTRY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass notes via env, never spliced into the shell source. Interpolating
          # ${{ }} directly into `run:` lets backticks/$() in a changelog row execute
          # as shell (command injection). $NOTES expansion does not re-evaluate them.
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          gh release create "$VERSION" \
            --title "craftkit $VERSION" \
            --notes "$NOTES"
