name: Site

# The site reads its version, package name and description from package.json at build time
# (site/vite.config.mjs), so every release bump redeploys it and those facts never go stale.
# Links into the README and the repo can't be derived; check.sh gates those instead.
# PRs only build, so a broken site fails review rather than the deploy after merge.
on:
  pull_request:
    paths: [site/**, package.json, .github/workflows/pages.yml]
  push:
    branches: [main]
    paths: [site/**, package.json, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy halfway; a newer push queues behind it and wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
